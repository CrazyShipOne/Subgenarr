[project]
name = "video-subtitle-worker"
version = "1.0.0"
description = "Worker service for automated video subtitle generation"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy==2.0.25",
    "python-dotenv==1.0.0",
    "httpx==0.26.0",
    "openai==1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
