name: Publish Docker image

on:
  release:
    types: [published]

jobs:
  sync-readme:
    name: Sync README to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Sync README to subgenarr-frontend
        uses: ms-jpq/sync-dockerhub-readme@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: crazyship/subgenarr-frontend
          readme: "./README.md"

      - name: Sync README to subgenarr-backend
        uses: ms-jpq/sync-dockerhub-readme@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: crazyship/subgenarr-backend
          readme: "./README.md"

      - name: Sync README to subgenarr-worker
        uses: ms-jpq/sync-dockerhub-readme@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: crazyship/subgenarr-worker
          readme: "./README.md"

  build-and-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: sync-readme
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            image: crazyship/subgenarr-frontend
            context: ./frontend_page
            dockerfile: ./frontend_page/Dockerfile
          - name: backend
            image: crazyship/subgenarr-backend
            context: ./backend_service
            dockerfile: ./backend_service/api/Dockerfile
          - name: worker
            image: crazyship/subgenarr-worker
            context: ./backend_service
            dockerfile: ./backend_service/worker/Dockerfile
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ matrix.image }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
